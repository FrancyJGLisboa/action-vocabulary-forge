schema_version: '2.0'
system_id: validation_example
concepts:
- concept_id: validation_failure
  kind: condition
  description: A completed validation run that did not succeed.
  observable: true
  value_type: object
  evidence_refs:
  - trace_failed_01
- concept_id: failure_transience
  kind: semantic_property
  description: Whether the observed failure is likely temporary rather than structural.
  observable: false
  value_type: probability
  evidence_refs:
  - runbook_retry
  - trace_retry_01
relations:
- relation_id: failure_has_transience
  subject_id: validation_failure
  predicate: has_semantic_property
  object_id: failure_transience
  evidence_refs:
  - runbook_retry
  - trace_retry_01
